name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Install system dependencies for buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libtool-bin m4 pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev

    - name: Verify autotools
      run: |
        libtoolize --version
        autoreconf --version

    - name: Build with Buildozer
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee android-build.log

    - name: Collect Android packages
      if: success()
      run: |
        mkdir -p release
        find . -type f \( -name '*.apk' -o -name '*.aab' \) -print
        find . -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} release/ \;
        test -n "$(find release -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-build-log
        path: android-build.log
        if-no-files-found: warn

    - name: Upload Android package
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: game-android-package
        path: release/*
        if-no-files-found: error
